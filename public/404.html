<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GM Advanced Competition Control Dashboard</title>
    <script>
      const parts = window.location.pathname.split('/').filter(Boolean);
      const route = parts[parts.length - 1];
      const base = route === 'dashboard' || route === 'summary' || route === 'setup'
        ? `/${parts.slice(0, -1).join('/')}/`
        : '/';
      window.location.replace(`${base}?redirect=${encodeURIComponent(window.location.pathname)}`);
    </script>
  </head>
  <body></body>
</html>
